<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LITReview - Créer un ticket</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: white;
            color: black;
            margin: 0;
        }

        header {
            border-bottom: 1px solid black;
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        header a.logo {
            text-decoration: none;
            color: black;
        }

        nav {
            position: absolute;
            right: 2rem;
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: black;
        }

        main {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 400;
            text-align: center;
            margin-bottom: 3rem;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
        }

        input[type="text"],
        textarea {
            font-family: 'Georgia', serif;
            font-size: 1rem;
            padding: 0.85rem 1rem;
            border: 1px solid black;
            margin-bottom: 2rem;
            box-sizing: border-box;
            width: 100%;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        .file-label {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: 1px solid #111;
            border-radius: 8px;
            background: transparent;
            font-family: 'Georgia', serif;
            cursor: pointer;
            width: fit-content;
            margin-bottom: 2rem;
        }

        input[type="file"] {
            display: none;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
        }

        button {
            padding: 0.75rem 2.2rem;
            border: 1px solid #111;
            border-radius: 8px;
            background: transparent;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
        }

        img {
            width: 200px;
        }

         .image-wrapper {
            position: relative;
            width: 200px;
        }

        #close-cross {
            position: absolute;
            top: 4px;
            right: 4px;
            margin: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: red;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <a href="{% url 'homepage' %}" class="logo">LITReview</a>
    <nav>
        <a href="{% url 'feed' %}">Flux</a>
        <a href="{% url 'posts' %}">Posts</a>
        <a href="{% url 'follows' %}">Abonnements</a>
        <a href="{% url 'logout' %}">Se déconnecter</a>
    </nav>
</header>

<main>
    <h2>Créer un ticket</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Titre</label>
        {{ ticket_form.title.errors }}
        <input type="text" id="title" name="title">

        <label>Description</label>
        {{ ticket_form.description.errors }}
        <textarea id="description" name="description"></textarea>

        <label>Image</label>
        <div class="image-wrapper">
            <img id="image-view" src="">
            <p id="close-cross" style="display: none;">X</p>
        </div>
        <label class="file-label" for="image">Télécharger fichier</label>
        <input type="file" id="image" name="image">
        <span id="file-name">Aucun fichier sélectionné</span>
        {{ ticket_form.image.errors }}

        <script>
            document.getElementById('image').addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    document.getElementById('file-name').textContent = file.name;
                    document.getElementById('image-view').src = URL.createObjectURL(file);
                    document.getElementById('close-cross').style.display = ''
                }
            });

            document.getElementById('close-cross').addEventListener('click', function() {
                document.getElementById('image').value = '';
                document.getElementById('image-view').src = '';
                document.getElementById('file-name').textContent = 'Aucun fichier sélectionné';
                document.getElementById('close-cross').style.display = 'none';
            });
        </script>

        <div class="actions">
            <button type="submit">Envoyer</button>
        </div>
        <h2>{{ success }}</h2>
    </form>
</main>

</body>
</html>
