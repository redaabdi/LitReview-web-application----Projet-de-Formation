<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LITReview - Flux</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: white;
            color: black;
            margin: 0;
        }

        header {
            border-bottom: 1px solid black;
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        header a.logo {
            text-decoration: none;
            color: black;
        }

        nav {
            position: absolute;
            right: 2rem;
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: black;
        }

        main {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .actions {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.75rem 2rem;
            border: 1px solid #111;
            border-radius: 8px;
            background: transparent;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
        }

        .flux-vide {
            text-align: center;
            color: #888;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

<header>
    <a href="{% url 'homepage' %}" class="logo">LITReview</a>
    <nav>
        <a href="{% url 'feed' %}">Flux</a>
        <a href="{% url 'posts' %}">Posts</a>
        <a href="{% url 'follows' %}">Abonnements</a>
        <a href="{% url 'logout' %}">Se déconnecter</a>
    </nav>
</header>

<main>
    <div class="actions">
        <a href="{% url 'create_ticket' %}">
        <button>Demander une critique</button>
        </a>
        <a href="{% url 'create_review' %}">
        <button>Créer une critique</button>
        </a>
    </div>

    <p class="flux-vide">Votre flux est vide pour le moment.</p>
    <p>Utilisateur connecté : {{ request.user }}</p>
</main>

</body>
</html>
