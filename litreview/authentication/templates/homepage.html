<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LITReview</title>
    <style>
      body {
          font-family: 'Georgia', serif;
          background: white;
          color: black;
          margin: 0;
      }
      header {
          border-bottom: 1px solid black;
          padding: 1.2rem;
          text-align: center;
      }
      main {
          display: grid;
          grid-template-columns: 1fr 1fr;
      }
      .signup, .login {
          padding: 5rem 4rem;
      }

      a {
        text-decoration: none;
        color: black;
      }
      h2 {
          font-size: 1.6rem;
          font-weight: 400;
          margin-bottom: 2rem;
      }
      input {
          display: block;
          padding: 0.85rem 1rem;
          font-family: 'Georgia', serif;
          margin-bottom: 1rem;
      }
      button {
          padding: 0.75rem 1.8rem;
          border: 1px solid #111;
          border-radius: 6px;
          background: transparent;
          font-family: 'Georgia', serif;
          cursor: pointer;
      }
      
      .button {
          display: flex;
          width: fit-content;
          padding: 0.75rem 2rem;
          border: 1px solid #111;
          border-radius: 8px;
          background: transparent;
          font-family: 'Georgia', serif;
          font-size: 1rem;
          cursor: pointer;
      }
      .login button {
          display: block;
          margin-top: 1rem;
      }
    </style>
</head>
<body>

  <header>LITReview</header>

  <main>
    <section class="signup">
      <h2>Inscrivez-vous maintenant</h2>
      <a href="{% url 'register' %}" class="button">S'inscrire </a>
    </section>

    <section class="login">
      <h2>Connectez-vous</h2>
      <form method="POST">
        {% csrf_token %}
        <input type="text" aria-label="Nom d'utilisateur" placeholder="Nom d'utilisateur" name="username">
        <input type="password" aria-label="Mot de passe" placeholder="Mot de passe" name="password">
        <button type="submit">Se connecter</button>
        {% if success %}
          <p>{{ success }}</p>
        {% endif %}
        {% if errors %}
          {% for error in errors %}
            <p>{{ error }}</p>
          {% endfor %}
        {% endif %}
      </form>
    </section>
  </main>

</body>
</html>
